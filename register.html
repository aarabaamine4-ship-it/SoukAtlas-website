<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | Souk Atlas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body class="auth-page" data-auth-page="register">
    <main class="auth-card">
      <a class="auth-logo" href="index.html"><span>SA</span> Souk Atlas</a>
      <p class="auth-kicker">Join the Marketplace</p>
      <h1>Create seller account</h1>
      <p class="auth-subtitle">Start posting meat listings and appear on the Souk Atlas map.</p>

      <div class="auth-alert" id="authAlert" hidden></div>

      <form class="auth-form" id="registerForm">
        <label>
          <span>Full name</span>
          <input type="text" id="nameInput" placeholder="Boucherie Atlas" required />
        </label>
        <label>
          <span>Email</span>
          <input type="email" id="emailInput" placeholder="seller@soukatlas.ma" required />
        </label>
        <label>
          <span>Password</span>
          <input type="password" id="passwordInput" placeholder="Create a password" required />
        </label>
        <button class="auth-button" type="submit">Create Account</button>
      </form>

      <div class="auth-links">
        <p>Already have an account? <a href="login.html">Login</a></p>
      </div>
    </main>

    <script src="auth.js"></script>
  </body>
</html>
