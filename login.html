<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Souk Atlas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body class="auth-page" data-auth-page="login">
    <main class="auth-card">
      <a class="auth-logo" href="index.html"><span>SA</span> Souk Atlas</a>
      <p class="auth-kicker">Merchant Workspace</p>
      <h1>Welcome back</h1>
      <p class="auth-subtitle">Log in to manage your meat listings and seller profile.</p>

      <div class="auth-alert" id="authAlert" hidden></div>

      <div class="social-grid">
        <button type="button">Continue with Google</button>
        <button type="button">Continue with Apple</button>
      </div>

      <div class="auth-divider"><span>or</span></div>

      <form class="auth-form" id="loginForm">
        <label>
          <span>Email</span>
          <input type="email" id="emailInput" placeholder="seller@soukatlas.ma" required />
        </label>
        <label>
          <span>Password</span>
          <input type="password" id="passwordInput" placeholder="Your password" required />
        </label>
        <button class="auth-button" type="submit">Login</button>
      </form>

      <div class="auth-links">
        <a href="#">Forgot password?</a>
        <p>No account yet? <a href="register.html">Create one</a></p>
      </div>
    </main>

    <script src="auth.js"></script>
  </body>
</html>
